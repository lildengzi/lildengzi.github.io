name: Sync Learning Data

on:
  schedule:
    - cron: "15 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-leetcode-cn:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Sync LeetCode.cn activity
        env:
          LEETCODE_CN_USER: lildengzi
          LEETCODE_CN_SESSION: ${{ secrets.LEETCODE_CN_SESSION }}
          LEETCODE_CN_CSRFTOKEN: ${{ secrets.LEETCODE_CN_CSRFTOKEN }}
        run: node scripts/sync-leetcode-cn.mjs

      - name: Commit learning data
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: sync LeetCode.cn learning data"
          file_pattern: data/learning.json
